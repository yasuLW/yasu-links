  <script>
    tailwind.config = {
      theme: {

          colors: {
            brandMagenta: '#ff3afc',
            brandDarkPlum: '#1d0324',
            brandMidPlum: '#3a0841',
            brandDeepFuchsia: '#580c62',
            brandHoverPlum: '#8e1586',
            brandBorderPurple: 'rgba(168, 85, 247, 0.35)',
          },
          animation: {
            'pulse-glow': 'subtlePulseGlow 2.5s infinite ease-in-out',
            'float-slow': 'floatBadge 4s ease-in-out infinite',
            'equalizer-1': 'equalize 1.2s ease-in-out infinite alternate',
            'equalizer-2': 'equalize 0.8s ease-in-out infinite alternate 0.2s',
            'equalizer-3': 'equalize 1.4s ease-in-out infinite alternate 0.4s',
            'equalizer-4': 'equalize 1.0s ease-in-out infinite alternate 0.1s',
          },
          keyframes: {
            subtlePulseGlow: {
              '0%, 100%': {
                boxShadow: '0 0 16px rgba(255, 58, 252, 0.35)',
                borderColor: 'rgba(255, 58, 252, 0.45)',
              },
              '50%': {
                boxShadow: '0 0 28px rgba(255, 58, 252, 0.65)',
                borderColor: 'rgba(255, 58, 252, 0.85)',
              },
            },
            floatBadge: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-5px)' },
            },
            equalize: {
              '0%': { height: '4px' },
              '100%': { height: '18px' },
            }
          }
        }
      }
    }


  </script>

  <style>
    *, button, input, select, textarea {
      font-family: 'Poppins', sans-serif !important;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: 'Poppins', sans-serif !important;
      background-color: #000000;
      color: #ffffff;
      min-height: 100dvh;
      overflow-x: hidden;
      selection-background-color: #ff3afc;
      selection-color: #ffffff;
    }

    ::selection {
      background: #ff3afc;
      color: #ffffff;
    }

    /* CUSTOM SCROLLBAR WITH MAGENTA BRANDING */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #7e1273;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff3afc;
    }

    /* SIGNATURE LEAN & WAVS BUTTON / CARD STYLES */
    .canva-info-card {
      background: linear-gradient(90deg, #1d0324 0%, #3a0841 25%, #580c62 50%, #3a0841 75%, #1d0324 100%);
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.15);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .canva-info-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 58, 252, 0.2), transparent);
      transition: left 0.6s ease;
      pointer-events: none;
    }

    .canva-info-card:hover::before {
      left: 100%;
    }

    .canva-info-card:hover {
      background: #8e1586;
      box-shadow: 0 0 32px rgba(255, 58, 252, 0.75), 0 0 12px rgba(255, 58, 252, 0.45);
      border-color: rgba(255, 58, 252, 0.95);
      color: #ffffff;
      transform: translateY(-3px) scale(1.015);
    }

    .canva-info-card:active {
      transform: translateY(-1px) scale(0.99);
      box-shadow: 0 0 20px rgba(255, 58, 252, 0.6);
    }

    /* HIGHLIGHTED CARD (SAME SIGNATURE VELVET GRADIENT) */
    .canva-featured-card {
      background: linear-gradient(90deg, #1d0324 0%, #3a0841 25%, #580c62 50%, #3a0841 75%, #1d0324 100%);
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.15);
    }
    .canva-featured-card:hover {
      background: #8e1586;
      box-shadow: 0 0 32px rgba(255, 58, 252, 0.75), 0 0 12px rgba(255, 58, 252, 0.45);
      border-color: rgba(255, 58, 252, 0.95);
    }

    /* SIGNATURE PILL BUTTON */
    .canva-pill-btn {
      background: linear-gradient(90deg, #1d0324 0%, #3a0841 25%, #580c62 50%, #3a0841 75%, #1d0324 100%);
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.15);
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .canva-pill-btn:hover {
      background: #8e1586;
      box-shadow: 0 0 30px rgba(255, 58, 252, 0.7), 0 0 10px rgba(255, 58, 252, 0.4);
      border-color: rgba(255, 58, 252, 0.9);
      color: #ffffff;
      transform: translateY(-2px) scale(1.02);
    }

    /* ARTWORK CONTAINER GLOW & 3D VIBE */
    .artwork-glow {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid rgba(255, 58, 252, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 58, 252, 0.35);
    }

    .artwork-glow:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 58, 252, 0.9);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 45px rgba(255, 58, 252, 0.75);
    }

    /* TOAST NOTIFICATION */
    #toast-notification {
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-notification" 
       class="fixed bottom-6 z-50 px-4 py-2.5 rounded-full bg-black/90 border border-[#ff3afc] shadow-[0_0_20px_rgba(255,58,252,0.8)] text-white text-xs font-bold tracking-wider flex items-center gap-2 pointer-events-none opacity-0 translate-y-4">

    <span id="toast-message">¡Enlace copiado al portapapeles!</span>

  <!-- IMAGE ZOOM MODAL (OPTIONAL INTERACTION) -->
  <div id="zoom-modal" 
       class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300"
       onclick="toggleArtworkZoom()">
    <div class="relative max-w-sm w-full rounded-2xl overflow-hidden border border-[#ff3afc] shadow-[0_0_40px_rgba(255,58,252,0.7)]"
         onclick="event.stopPropagation()">
      <img src="assets/cover.jpg?v=2" 
           alt="YASU" 
           class="w-full h-auto object-cover"
           onerror="this.onerror=null; this.src='assets/cover.jpg'">
      <div class="p-4 bg-[#1d0324] flex items-center justify-between">
        <div>
          <p class="text-sm font-black text-white uppercase">YASU</p>
          <p class="text-xs text-fuchsia-300">@yasu.lw</p>
        </div>
        <button onclick="toggleArtworkZoom()" class="px-3 py-1 rounded-full bg-black/60 border border-white/20 text-xs font-bold text-white hover:border-[#ff3afc]">
          Cerrar
        </button>
      </div>
    </div>

  <!-- INTERACTIVITY SCRIPT -->
  <script>
    // Share / Copy Link Functionality (100% Reliable across file:// and https://)
    const shareBtn = document.getElementById('share-btn');
    const toast = document.getElementById('toast-notification');
    const toastMsg = document.getElementById('toast-message');

    function showToast(msg) {
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }

    function getShareUrl() {
      // If viewed locally via file://, share the live profile URL
      return (window.location.protocol === 'file:')
        ? 'https://irlpages.com/p/yasu/yasu'
        : (window.location.origin + window.location.pathname);
    }

    function copyToClipboard() {
      const url = getShareUrl();

      // Fallback function using textarea (works on file:// and all browsers)
      const fallbackCopy = (text) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(ta);
          if (successful) {
            showToast('¡Enlace copiado al portapapeles!');
          } else {
            prompt('Copia tu enlace oficial:', text);
          }
        } catch (e) {
          prompt('Copia tu enlace oficial:', text);
        }
      };

      // Try modern navigator.clipboard if available
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url)
          .then(() => showToast('¡Enlace copiado al portapapeles!'))
          .catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
    }

    if (shareBtn) {
      shareBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const url = getShareUrl();
        const shareData = {
          title: 'YASU (@yasu.lw) — LEAN & WAVS',
          text: 'Escucha la música de YASU en Spotify, Apple Music, YouTube y síguelo en sus redes:',
          url: url,
        };

        // If Web Share API is available (Mobile & macOS Safari)
        if (navigator.share && (!navigator.canShare || navigator.canShare(shareData))) {
          try {
            await navigator.share(shareData);
          } catch (err) {
            if (err.name !== 'AbortError') copyToClipboard();
          }
        } else {
          // On desktop / local file, copy directly with toast
          copyToClipboard();
        }
      });
    }

    function toggleArtworkZoom() {
      const modal = document.getElementById('zoom-modal');
      const isHidden = modal.classList.contains('pointer-events-none');
      if (isHidden) {
        modal.classList.remove('pointer-events-none', 'opacity-0');
        modal.classList.add('opacity-100');
      } else {
        modal.classList.add('pointer-events-none', 'opacity-0');
        modal.classList.remove('opacity-100');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('zoom-modal');
        if (modal && !modal.classList.contains('pointer-events-none')) {
          toggleArtworkZoom();
        }
      }
    });
  
    // YouTube Launch Handler (Direct to Native YouTube App on Mobile / New Tab on Desktop)
    function playFeaturedVideo(e) {
      if (e) e.preventDefault();
      const videoUrl = 'https://www.youtube.com/watch?v=EHPGCmhoeyM';
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        // Direct location navigation triggers iOS Universal Links / Android App Links to open the native YouTube app
        window.location.href = videoUrl;
      } else {
        // On desktop, open in a new tab smoothly
        window.open(videoUrl, '_blank', 'noopener,noreferrer');
      }
    }

    // Fallback handler for local file:// testing
    document.addEventListener('DOMContentLoaded', () => {
      const isFileProtocol = window.location.protocol === 'file:';
      const iframe = document.getElementById('featured-video-iframe');
      if (isFileProtocol && iframe) {
        const wrapper = document.getElementById('video-wrapper');
        if (wrapper) {
          wrapper.innerHTML = `
            <div class="relative w-full h-full cursor-pointer bg-[#14021a] flex flex-col items-center justify-center text-center p-4 group" onclick="window.open('https://www.youtube.com/watch?v=EHPGCmhoeyM', '_blank')">
              <img src="assets/cover.jpg?v=2" alt="Vista previa" class="absolute inset-0 w-full h-full object-cover opacity-35 filter blur-sm">
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-black/60"></div>
              <div class="relative z-10 flex flex-col items-center">
                <div class="w-16 h-16 rounded-full bg-black/70 border-2 border-[#ff3afc] shadow-[0_0_30px_rgba(255,58,252,0.85)] flex items-center justify-center text-white mb-2 transition-transform duration-300 group-hover:scale-110">
                  <svg class="w-7 h-7 text-white fill-current ml-1" viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                </div>
                <span class="text-xs font-bold text-white tracking-wider uppercase">Ver Vista Previa en YouTube</span>
                <span class="text-[10px] text-fuchsia-300 mt-0.5">En producción (Netlify) se reproduce aquí directamente</span>
              </div>
            </div>
          `;
        }
      }
    });


    // ==========================================
    // LEAN & WAVS • REAL-TIME CLICK ANALYTICS
    // ==========================================
    const LW_ANALYTICS = {
      pageId: 'yasu',
      supabaseUrl: 'https://bmmknbppkshgeazzifal.supabase.co',
      getAnonKey: function() {
        return localStorage.getItem('lw_supabase_anon_key') || 'sb_publishable_ZJob6hBCW_YCKf82AvJ57A_pc_v0Ecx';
      },
      track: function(eventType, platform) {
        let refDomain = 'directo';
        try {
          if (document.referrer) {
            const u = new URL(document.referrer);
            refDomain = u.hostname.replace('www.', '');
            if (refDomain.includes('instagram')) refDomain = 'Instagram';
            else if (refDomain.includes('tiktok')) refDomain = 'TikTok';
            else if (refDomain.includes('youtube')) refDomain = 'YouTube';
            else if (refDomain.includes('spotify')) refDomain = 'Spotify';
          }
        } catch(e) {}

        const payload = {
          page_id: this.pageId,
          event_type: eventType,
          platform: platform || 'landing',
          device: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
          referrer: refDomain,
          created_at: new Date().toISOString()
        };

        // Cache locally for instant preview in dashboard
        try {
          const key = 'lw_analytics_' + this.pageId;
          const events = JSON.parse(localStorage.getItem(key) || '[]');
          events.push(payload);
          if (events.length > 500) events.shift();
          localStorage.setItem(key, JSON.stringify(events));
        } catch(e) {}

        // Send to Supabase if configured
        const anonKey = this.getAnonKey();
        if (this.supabaseUrl && anonKey) {
          const endpoint = this.supabaseUrl + '/rest/v1/analytics_events';
          const body = JSON.stringify(payload);
          try {
            fetch(endpoint, {
              method: 'POST',
              headers: {
                'apikey': anonKey,
                'Authorization': 'Bearer ' + anonKey,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
              },
              body: body,
              keepalive: true
            }).catch(function() {});
          } catch(e) {}
        }
      }
    };

    // Auto-track page view
    LW_ANALYTICS.track('view', 'landing');

    // Auto-track all clicks with data-track attribute
    document.addEventListener('click', function(e) {
      const el = e.target.closest('[data-track]');
      if (el) {
        const trackTag = el.getAttribute('data-track');
        if (trackTag) {
          LW_ANALYTICS.track('click', trackTag);
        }
      }
    });

  </script>
